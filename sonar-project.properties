# SonarQube Cloud (sonarcloud.io) — read by SonarSource/sonarqube-scan-action in ci-cd.yml
sonar.projectKey=Buffden_diagram-sync
sonar.organization=buffden
sonar.projectName=diagram-sync

# SonarQube Cloud's analysis scope covers the whole repo and detects tests
# itself (sonar.sources / sonar.tests are ignored), so only exclusions apply.
# Keep docs, rendered diagrams and binary media out of the analysis.
sonar.exclusions=docs/**,diagrams/**,demo-files/**,**/*.png,**/*.gif,**/*.svg,**/*.pdf

# lcov written by `npm run coverage` (vitest + @vitest/coverage-v8)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Test files aren't auto-classified as tests here, so without this they count
# as uncovered source and fail the new-code coverage gate.
sonar.coverage.exclusions=src/__tests__/**,**/*.test.ts

sonar.sourceEncoding=UTF-8

# S4036 ("PATH should only contain fixed, unwriteable directories"): resolving
# external renderers (plantuml, mmdc, dot, d2, drawio, npm, git) through the
# user's PATH is the tool's purpose — install locations differ per OS and
# package manager, so absolute paths would break real installs. All calls use
# spawnSync with argument arrays (no shell), so there's no injection surface.
sonar.issue.ignore.multicriteria=pathlookup
sonar.issue.ignore.multicriteria.pathlookup.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.pathlookup.resourceKey=src/**/*.ts
