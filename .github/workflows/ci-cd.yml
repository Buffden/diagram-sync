name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  ci:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    env:
      # Job-level so the Sonar step's `if:` can test for it
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so SonarQube Cloud can blame lines and detect new code
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts: dependency install hooks never run. Only esbuild has one
      # (a binary sanity check); its platform binary still installs normally.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Coverage
        if: matrix.node-version == 20
        run: npm run coverage

      - name: Upload coverage to Coveralls
        if: matrix.node-version == 20
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache SonarQube packages
        if: matrix.node-version == 20 && env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Reuses coverage/lcov.info from the Coverage step. Skipped when SONAR_TOKEN
      # is unavailable (fork and Dependabot PRs don't receive repo secrets).
      - name: SonarQube Cloud scan
        if: matrix.node-version == 20 && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          # Fail this job when the quality gate fails, so it can block merges
          args: >
            -Dsonar.qualitygate.wait=true

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      # --ignore-scripts: dependency install hooks never run. Only esbuild has one
      # (a binary sanity check); its platform binary still installs normally.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Verify version is not already published
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view diagram-sync@$PKG_VERSION version 2>/dev/null || echo "")
          if [ -n "$PUBLISHED" ]; then
            echo "ERR: Version $PKG_VERSION is already published on npm"
            exit 1
          fi
          echo "Version $PKG_VERSION is available, proceeding."

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
