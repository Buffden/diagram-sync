version: 2

updates:
  # npm packages in package.json / package-lock.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: thursday
    # Hold back releases younger than this. Most malicious npm versions are
    # caught and unpublished within days; this keeps them out of the lockfile.
    # Security updates ignore the cooldown and still arrive immediately.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(dev-deps)
    groups:
      # One PR a week for routine dev tooling bumps instead of one per package.
      # Majors stay separate PRs so each breaking change gets its own review.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  # Actions used in .github/workflows (checkout, setup-node, upload-artifact, ...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(actions)
    groups:
      github-actions:
        patterns: ["*"]
